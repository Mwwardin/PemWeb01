<!DOCTYPE html>
<html>
<head>
    <title>Layout HTML5</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        header, nav, article, aside, section, footer {
            border: 1px solid black;
        }
        header, nav {
            height: 50px;
        }
        article, aside {
            float: left;
            width: 50%;
        }
        section {
            height: 100px;
        }
        aside {
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <header>
        <h1>Logo dan Nama Web</h1>
    </header>
    <nav>
        <ul>
            <li><a href="#">Beranda</a></li>
            <li><a href="#">Tentang Kami</a></li>
            <li><a href="#">Kontak</a></li>
        </ul>
    </nav>
    <article>
        <section>
            </section>
        <section>
            </section>
        <section>
            </section>
    </article>
    <aside>
        <h2>Sidebar</h2>
        <p>Ini adalah konten sidebar.</p>
    </aside>
    <footer>
        <p>&copy; 2023 Contoh Website</p>
    </footer>
</body>
</html>
